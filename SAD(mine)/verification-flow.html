<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volunteer verification: valid ID, face recognition and health assessment</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--g:#0f5c45;--g2:#0f5c45;--gl:#e6f1ea;--o:#f2a33a;--bg:#f7f7f7;--c:#fff;--t:#1d2b23;--m:#66756b;--b:#dde5df;--r:#c0392b;--bl:#1f4e9c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#101712;--c:#1a241d;--t:#e8efe9;--m:#9aab9f;--b:#2b3a2f;--gl:#1f3527;--g:#3f9a68;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--t)}
a{color:inherit;text-decoration:none;cursor:pointer}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{line-height:1.2;margin:0 0 8px}
p{margin:0 0 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:10px;border:1.5px solid var(--g);background:var(--g);color:#fff;font-weight:600;cursor:pointer}
.btn.o{background:var(--o);border-color:var(--o);color:#fff}
.btn.l{background:transparent;color:var(--g)}
.btn.w{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ctr{text-align:center}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:18px}
.g2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.pill{padding:6px 14px;border-radius:99px;border:1px solid var(--b);background:var(--c);cursor:pointer}
.pill.on{background:var(--g);color:#fff;border-color:var(--g)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--gl);color:var(--g)}
.muted{color:var(--m)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--b);border-radius:10px;background:var(--c)}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}
.stp{display:flex;gap:6px;margin:6px 0 16px}
.stp span{flex:1;text-align:center;font-size:12px;color:var(--m);border-top:3px solid var(--b);padding-top:4px}
.stp em{display:block;font-style:normal}
.stp .on{border-color:var(--o);color:var(--t);font-weight:700}
.stp .dn{border-color:var(--g);color:var(--g)}
.up{border:2px dashed var(--b);border-radius:12px;padding:16px;text-align:center;cursor:pointer;display:block;font-weight:400;margin:0}
.up img{max-width:100%;max-height:90px;border-radius:8px}
.note{background:var(--gl);border-radius:10px;padding:12px 14px;font-size:14px;margin:12px 0}
.note ul{margin:4px 0 0;padding-left:18px}
.skip{display:block;text-align:center;margin-top:12px;color:var(--g);font-weight:600;text-decoration:underline}
.big{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:30px;color:#fff;background:var(--g);margin:0 auto 12px}
.big.w{background:var(--o)}
.oval{border:3px dotted var(--o);border-radius:50%;width:150px;height:200px;margin:12px auto;display:grid;place-items:center;font-size:48px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.err{color:var(--r);font-size:13px;min-height:18px;margin-top:6px}
.ic{vertical-align:-4px;flex:none}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#d33;margin-right:6px}
.card{box-shadow:0 1px 4px #0000000f}
.up svg,.card.ctr>svg,.oval{color:var(--g)}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.btn{border-radius:8px}
.card{border:0;border-radius:10px;box-shadow:0 2px 8px #0000001a}
.note{background:var(--gl)}
.pill{background:var(--gl);border:0;color:var(--g);font-weight:600;font-size:13px}
.pill.on{background:var(--g);color:#fff}
.row>h1{color:var(--g);font-size:26px}
body{line-height:1.6;-webkit-font-smoothing:antialiased}
h1{font-size:28px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:16px;font-weight:700}
h1,h2,h3{text-wrap:balance}
p{text-wrap:pretty}
.card h3{margin:0 0 4px}
.card p{margin:0 0 8px}
.card p:last-child{margin-bottom:0}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101712;--c:#1a241d;--t:#e8efe9;--m:#9aab9f;--b:#2b3a2f;--gl:#1f3527;--g:#3f9a68;color-scheme:dark}}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;margin:0}
.vwrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 94% 6%,#fbf1cf 0 110px,transparent 111px),radial-gradient(circle at 4% 96%,#fbf1cf 0 70px,transparent 71px),var(--bg)}
.vcard{width:100%;max-width:470px;background:var(--c);border-radius:18px;padding:34px;box-shadow:0 2px 12px #00000014}
h2{font-size:21px;font-weight:700;text-wrap:balance}p{text-wrap:pretty}
@media(max-width:480px){.vcard{padding:22px}.vwrap{padding:12px}}
</style></head><body>
<main class="vwrap"><div class="vcard" id="app"></div></main>
<script>
/* Volunteer verification flow: valid ID upload, face recognition and health assessment.
   Standalone extract of the Sulong! San Pablo user portal. No dependencies. */
const P={tree:'<path d="M12 22v-6"/><path d="M12 16c-4 0-6-2.5-6-5 0-1.5.8-2.8 2-3.5C8 5 9.800 3 12 3s4 2 4 4.500c1.200.7 2 2 2 3.500 0 2.500-2 5-6 5z"/>',bowl:'<path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 7c0-1 1-2 1-3M12 7c0-1 1-2 1-3M16 7c0-1 1-2 1-3"/>',health:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/>',book:'<path d="M4 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4z"/><path d="M20 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z"/>',people:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14a4 4 0 0 1 4 4v2"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',qr:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v7M14 20h3"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',award:'<circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 22l5-3 5 3-1.5-8"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',upload:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',download:'<path d="M12 4v12M7 11l5 5 5-5M4 20h16"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',pin:'<path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',leaf:'<path d="M5 19c0-9 5-14 15-14 0 10-5 15-14 15"/><path d="M5 19c3-5 6-8 10-10"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',idcard:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.5-2 5.5-2 6 0M14 10h4M14 14h4"/>',face:'<circle cx="12" cy="12" r="9"/><path d="M9 10v1M15 10v1M8.5 15c2 2 5 2 7 0"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>'};
const ic=(n,z=20)=>`<svg class="ic" width="${z}" height="${z}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const S={md:'v',verified:false,r:{step:2,sub:'',idt:'',f:null,b:null,face:0,cond:['Asthma'],cap:1}};
const emit=(n,d)=>document.dispatchEvent(new CustomEvent(n,{detail:d}));
const wz=n=>`<div class="muted" style="font-size:12px;font-weight:700">STEP ${n} OF 4</div><div class="stp">${['Account','Verify ID','Face match','Health check'].map((x,i)=>`<span class="${i+1==n?'on':i+1<n?'dn':''}">${i+1<n?'✓':i+1}<em>${x}</em></span>`).join('')}</div>`;
const pick=(k,i)=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.r[k]={n:f.name,u:r.result};render()};r.readAsDataURL(f)};
const scan=()=>{S.r.sub='scan';render();setTimeout(()=>{if(S.r.sub=='scan'){S.r.sub='ok';render()}},1500)};
const cond=c=>{const a=S.r.cond;S.r.cond=c=='None'?['None']:(a.includes(c)?a.filter(x=>x!=c):[...a.filter(x=>x!='None'),c]);render()};
const CAP=['Fully able','Limited','Not able now'];
const result=()=>{const R=S.r;return{verified:!!(R.idt&&R.f&&R.b&&R.face),idType:R.idt,idFront:R.f&&R.f.n,idBack:R.b&&R.b.n,idFrontImage:R.f&&R.f.u,idBackImage:R.b&&R.b.u,faceMatched:!!R.face,conditions:R.cond,capability:CAP[R.cap]}};
const finish=()=>{S.verified=result().verified;S.r.step=5;emit('verification:complete',result());render()};
const restart=()=>{Object.assign(S.r,{step:2,sub:'',idt:'',f:null,b:null,face:0,cond:['Asthma'],cap:1});render()};
function body(){const R=S.r;let h='';
if(R.step==2){const ok=R.idt&&R.f&&R.b;const z=(k,l)=>R[k]?`<label class="up"><img src="${R[k].u}"><div style="font-size:13px">${R[k].n}</div><b style="color:var(--g)">Replace</b><input type="file" accept="image/jpeg,image/png" hidden onchange="pick('${k}',this)"></label>`:`<label class="up">${ic('upload',26)}<div><b>${l}</b></div><div class="muted" style="font-size:13px">Tap to upload · JPG or PNG</div><input type="file" accept="image/jpeg,image/png" hidden onchange="pick('${k}',this)"></label>`;
 h=`${wz(2)}<h2>Verify your identity</h2><p class="muted">Upload a valid government-issued ID so we can confirm who you are before you start volunteering.</p><label>ID type</label><select onchange="S.r.idt=this.value;render()"><option value="">Select ID type</option>${['Driver’s License','Passport','UMID','PhilSys ID','Voter’s ID','Postal ID'].map(x=>`<option ${R.idt==x?'selected':''}>${x}</option>`).join('')}</select><div class="g2" style="margin-top:12px">${z('f','Front of ID')}${z('b','Back of ID')}</div><div class="note"><ul><li>Make sure all four corners are visible.</li><li>Avoid glare, shadows and blurry photos.</li><li>Your ID is encrypted and used only for verification.</li></ul></div><button class="btn o w" ${ok?'':'disabled'} onclick="S.r.step=3;S.r.sub='';render()">Continue</button>`}
else if(R.step==3){
if(R.sub=='ok')h=`${wz(3)}<div class="big">✓</div><h2 class="ctr">Face matched!</h2><p class="muted ctr">Your face matches the photo on your ID. One last step: a quick health check.</p><div class="g2"><div class="card ctr">${ic('idcard',40)}<br><b>Photo on ID</b><div class="muted" style="font-size:12px">From your uploaded ID</div></div><div class="card ctr">${ic('face',40)}<br><b>Your selfie</b><div class="muted" style="font-size:12px">Taken just now</div></div></div><p class="ctr" style="margin:12px 0"><span class="tag">✓ Identity verified</span></p><button class="btn o w" onclick="S.r.face=1;S.r.step=4;render()">Continue to health check</button>`;
else if(R.sub=='fail')h=`${wz(3)}<div class="big w">!</div><h2 class="ctr">We couldn’t match your face</h2><p class="muted ctr">Don’t worry, this happens sometimes. Try again after checking the tips below.</p><div class="note"><ul><li>Your face was partly covered by a mask, cap or glasses.</li><li>The room was too dark or too bright.</li><li>The photo on your ID is blurry or unclear.</li></ul></div><button class="btn o w" onclick="S.r.sub='';render()">Try again</button><button class="btn l w" style="margin-top:8px" onclick="S.r.step=2;S.r.sub='';render()">Re-upload ID</button><p class="muted ctr" style="font-size:13px;margin-top:10px">Need help? Contact the barangay office</p>`;
else h=`${wz(3)}<h2>Face verification</h2><p class="muted">We’ll compare your face with the photo on your ID to confirm it’s really you.</p><div class="card ctr"><div class="muted" style="font-size:13px"><span class="dot"></span>Camera on</div><div class="oval">${ic('face',72)}</div><b>${R.sub=='scan'?'Scanning… hold still':'Position your face inside the oval'}</b><div class="muted" style="font-size:13px">Hold still, then blink once when asked.</div></div><div class="chips" style="margin:12px 0"><span class="tag">✓ Good lighting</span><span class="tag">✓ No mask or glasses</span><span class="tag">✓ Look straight</span></div><button class="btn o w" ${R.sub=='scan'?'disabled':''} onclick="scan()">Start face scan</button><div class="row sp"><a class="muted" onclick="S.r.step=2;render()">← Back</a><a class="muted" style="font-size:12px" onclick="S.r.sub='fail';render()">(demo: simulate failed match)</a></div>`}
else{const C=['None','Asthma','Heart condition','Hypertension','Diabetes','Allergies','Other'],P=[['Fully able','No restrictions'],['Limited','Light tasks only'],['Not able now','Admin will follow up']];
h=`${wz(4)}<h2>Health & capability check</h2><p class="muted">Let us know about any health conditions so we can match you with activities that are safe for you.</p><label>Do you have any health conditions? Select all that apply</label><div class="chips">${C.map(c=>`<button class="pill ${R.cond.includes(c)?'on':''}" onclick="cond('${c}')">${R.cond.includes(c)?'✓ ':''}${c}</button>`).join('')}</div><label>Other conditions or notes <span class="muted">(Optional)</span></label><input placeholder="e.g. allergic to dust, recent surgery"><label>Are you physically able to join volunteer activities?</label><div class="chips">${P.map((p,i)=>`<button class="pill ${R.cap==i?'on':''}" onclick="S.r.cap=${i};render()">${p[0]} <small>(${p[1]})</small></button>`).join('')}</div><div class="note">✓ Your health details are confidential and only used to match you with safe activities.</div><button class="btn o w" onclick="finish()">${S.md=='v'?'Finish verification':'Finish & create account'}</button>`}

if(R.step==5){const r=result();h=`<div class="ctr"><div class="big">✓</div><h2>Verification complete!</h2><p class="muted">Your identity has been verified. You can now join volunteer activities.</p></div><div class="note"><ul><li>ID: ${r.idType}, front and back uploaded</li><li>Face match: ${r.faceMatched?'matched':'not matched'}</li><li>Health conditions: ${r.conditions.join(', ')||'none'}</li><li>Capability: ${r.capability}</li></ul></div><button class="btn l w" onclick="restart()">Start over</button>`}
return h}
const render=()=>{const y=scrollY;document.getElementById('app').innerHTML=body();scrollTo(0,y)};
document.addEventListener('verification:complete',e=>console.log('verification:complete',e.detail));
render();
</script>
</body></html>
