const neList=()=>NEWS.map((x,i)=>({x,i})).sort((a,b)=>new Date(b.x.post.replace(' | ',' '))-new Date(a.x.post.replace(' | ',' '))).filter(({x})=>(x.t+x.x).toLowerCase().includes(S.nq.toLowerCase())).map(({x,i})=>`<article class="card announcement-card"><div class="announcement-card-head"><h3>${x.t}</h3><span class="tag ${x.g=='Important'?'or':x.g=='Upcoming'?'bl':''}">${x.g}</span></div><p class="announcement-card-date"><span>Activity date · ${x.d}</span><span>Posted · ${x.post}</span></p><p class="announcement-card-copy">${x.x}</p><button class="btn l s announcement-card-action" onclick="go('#/read/${i}')">Read More</button></article>`).join('')||'<p class="muted">No announcements found.</p>';
function news(){return page('news',`<h1>Announcements</h1><label for="announcement-search">Search announcements</label><input id="announcement-search" placeholder="Search by title or message..." value="${S.nq}" oninput="S.nq=this.value;nl.innerHTML=neList()"><h2 style="margin-top:20px">Latest Announcements</h2><div id="nl" style="display:grid;gap:12px">${neList()}</div>`)}
function read(i){
 const x=NEWS[i];if(!x)return page('news','<p>Not found.</p>');
 const c=i==0,e=x.e!==undefined?E[x.e]:null;
 const intro=c?'<p class="announcement-deck"><i>Sama-sama para sa malinis at ligtas na barangay!</i></p>':'';
 const body=c
  ?`<section><h2>About this activity</h2><p>${x.x}</p><p>Join our monthly community service program and help maintain a clean, safe, and orderly barangay.</p></section><section><h2>What to expect</h2><p>Volunteers will work together to clean designated areas and support a healthier, safer community. Please review the activity information for the schedule, meeting place, and registration details.</p><p>Thank you for your continued support and care for our community. Together, we can build a cleaner and more progressive Barangay San Pablo!</p></section>`
  :`<section><h2>Announcement</h2><p>${x.x}</p></section>`;
 const eventDetails=e?`<div class="announcement-fact"><small>Activity date</small><strong>${activityDate(x.e)}</strong></div><div class="announcement-fact"><small>Time</small><strong>7:00 AM – 12:00 PM</strong></div><div class="announcement-fact"><small>Location</small><strong>${e[3]}</strong></div><div class="announcement-fact"><small>Participants</small><strong>All registered volunteers</strong></div><div class="announcement-fact"><small>Registration</small><strong>${e[5]} of ${e[6]} slots filled</strong></div><div style="grid-column:1/-1;margin-top:14px"><button class="btn" onclick="go('#/activity/${x.e}')">View Activity Details</button></div>`:'';
 return page('news',back('news','Back to Announcements')+`<div class="announcement-layout"><article class="card announcement-article"><div class="announcement-eyebrow">${x.cat} announcement · ${x.g}</div><h1>${x.t}</h1>${intro}<div class="announcement-byline"><span>Posted ${x.post}</span><span>By Barangay Administrator</span><span>Status: Published</span></div><div class="announcement-body">${body}</div><section class="announcement-details-grid" aria-label="Announcement details"><div class="announcement-fact"><small>Category</small><strong>${x.cat}</strong></div><div class="announcement-fact"><small>Priority</small><strong>${x.g}</strong></div>${eventDetails}<div class="announcement-fact"><small>Date posted</small><strong>${x.post}</strong></div><div class="announcement-fact"><small>Posted by</small><strong>Barangay Administrator</strong></div></section></article></div>`);
}
const qr=z=>{let s=7,b='',g=n=>{s=(s*9301+49297)%233280;return s/233280};for(let y=0;y<21;y++)for(let x=0;x<21;x++){const f=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);const e=f?((x%14<7?x%14:x-14)%6==0||(y%14<7?y%14:y-14)%6==0||(((x%14)%7>1&&(x%14)%7<5)&&((y%14)%7>1&&(y%14)%7<5))):g()>.5;if(e)b+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}return `<svg id="qrs" xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 23 23" width="${z}" height="${z}" fill="#1d2b23" style="background:#fff;border-radius:8px">${b}</svg>`};
const vm=()=>{const R=S.r;const body=R.step==5?(R.cap==2?`<div class="ctr"><div class="big w">!</div><h2>Account creation paused</h2><p class="muted">Based on your health assessment, you indicated that you are not able to participate right now. You can try again on ${healthRetryDate()}.</p><button class="btn l" onclick="set('md','')">Close</button></div>`:S.verified?`<div class="ctr"><div class="big">✓</div><h2>Verification complete!</h2><p class="muted">Your identity has been verified. You can now join activities that match your health assessment.</p><div class="row" style="justify-content:center;margin-top:16px"><button class="btn" onclick="S.md='';go('#/browse')">Browse events</button><button class="btn l" onclick="set('md','')">Close</button></div></div>`:`<div class="ctr"><div class="big w">!</div><h2>Verification incomplete</h2><p class="muted">We still need your ID and a face match. Please try again.</p><button class="btn o" onclick="verifyNow()">Start again</button></div>`):regBody();return `<div class="md"><div style="max-width:540px"><a class="muted" style="float:right;cursor:pointer" onclick="set('md','')" aria-label="Close">${ic('x',18)}</a>${body}</div></div>`};
const vbar=()=>S.verified?`<div class="vb ok"><div><b>${ic('shield',16)} Identity verified</b><p>${S.r.cap==0?'You can join any open activity.':S.r.cap==1?'You can join activities marked as light.':'Activity participation is paused based on your health assessment.'}</p></div></div>`:`<div class="vb"><div><b>Your account isn’t verified yet</b><p>Verify your identity to join activities that match your health assessment.</p></div><button class="btn o" onclick="verifyNow()">Verify now</button></div>`;
const sh=(e,t,x)=>`<div class="sh"><small>${e}</small><h2>${t}</h2>${x?`<p>${x}</p>`:''}</div>`;
function account(){const I=[['Full Name',S.name],['Date of Birth',displayBirthday()],['Gender',S.profile.gender],['Address',S.profile.address],['Phone Number',S.profile.phone],['Email Address',profileEmail()]],healthLabel=['Fully able','Limited','Not able now'][S.r.cap];
return page('account',`<div class="row sp"><div class="row"><span class="profile-photo">${S.photo?`<img src="${S.photo}" alt="Profile photo">`:'V'}</span><div><h1 style="margin:0">${escapeHtml(S.name)}</h1><span class="tag ${S.verified&&S.r.cap!=2?'':'rd'}">${S.r.cap==2?'Participation Paused':S.verified?'Active Volunteer':'Unverified'}</span></div></div><button class="btn l" onclick="S.logged=false;go('#/login')">Log Out</button></div>${S.verified?vbar():''}<section class="card health-status"><div class="row sp"><div><h2>Health assessment</h2><p class="muted">Current participation level: <b>${healthLabel}</b>${S.r.cap==1?' · Only light activities are available.':''}${S.r.cap==2&&healthCooldownActive()?` · You can reassess after ${healthRetryDate()}.`:''}</p></div><button class="btn l" onclick="startHealthAssessment()">Assess my health</button></div></section><div class="g2" style="margin-top:20px"><div class="card"><div class="row sp"><h3>Personal Information</h3><button class="btn l s" onclick="openProfileEdit()">Edit Profile</button></div><div class="kv" style="grid-template-columns:1fr 1fr;gap:14px">${I.map((x,i)=>`<div style="${[0,3,4,5].includes(i)?'grid-column:1/-1':''}"><small>${x[0]}</small>${escapeHtml(x[1])}</div>`).join('')}</div></div><div class="card ctr"><h3>My Volunteer QR</h3>${qr(180)}<p><b>Volunteer ID: ${VID}</b></p><p class="muted">Permanent Volunteer QR. One QR identity for all registered barangay activities.</p><div class="note">This QR code is used for attendance check-in at all barangay programs. It does not change per activity.</div><button class="btn" onclick="save(new Blob([document.getElementById('qrs').outerHTML],{type:'image/svg+xml'}),'${VID}-QR.svg')">Download QR</button></div><div class="card"><h3>Volunteer Summary</h3><div class="kv">${[['Total Activities','08'],['Completed','05'],['Service Hours','24 hrs'],['Certificates Earned','03']].map(x=>`<div><small>${x[0]}</small><span class="stat">${x[1]}</span></div>`).join('')}</div></div><div class="card"><h3>Account Security</h3><p class="muted">Keep your account secure</p><label>Password</label><div class="row" style="flex-wrap:nowrap"><input id="pwf" type="${S.pv?'text':'password'}" value="${S.pv?'********':'••••••••'}" readonly><button class="btn l s" onclick="set('pv',S.pv?0:1)">${S.pv?'Hide':'Show'}</button></div><button class="btn" style="margin-top:12px" onclick="chpw()">Change Password</button></div></div>${S.md=='v'?vm():''}`)}
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const profileEmail=()=>S.r.em||S.profile.email||'juandelacruz@gmail.com';
const displayBirthday=()=>new Date(S.profile.bd+'T00:00:00').toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
const profileAvatar=()=>`<label class="profile-photo-control" title="Change profile photo"><span class="profile-photo">${S.photo?`<img src="${S.photo}" alt="Profile photo">`:'V'}</span><span class="btn l s">Change photo</span><input type="file" accept="image/jpeg,image/png,image/webp" hidden onchange="pickProfilePhoto(this)"></label>`;
const openProfileEdit=()=>{S.profileDraft={name:S.name,bd:S.profile.bd,gender:S.profile.gender,address:S.profile.address,phone:S.profile.phone,email:profileEmail()};S.md='profile';render()};
function profileModal(){const p=S.profileDraft;return `<div class="md"><section class="profile-modal" role="dialog" aria-modal="true" aria-labelledby="profile-modal-title"><div class="row sp"><h2 id="profile-modal-title">Edit Profile</h2></div><p class="muted">Update your personal details below.</p>${profileAvatar()}<label for="profile-name">Full Name</label><input id="profile-name" autocomplete="name" value="${escapeHtml(p.name)}"><label for="profile-birthday">Date of Birth</label><input id="profile-birthday" type="date" value="${escapeHtml(p.bd)}"><label for="profile-gender">Gender</label><select id="profile-gender"><option ${p.gender=='Male'?'selected':''}>Male</option><option ${p.gender=='Female'?'selected':''}>Female</option><option ${p.gender=='Other'?'selected':''}>Other</option><option ${p.gender=='Prefer not to say'?'selected':''}>Prefer not to say</option></select><label for="profile-address">Address</label><input id="profile-address" autocomplete="street-address" value="${escapeHtml(p.address)}"><label for="profile-phone">Phone Number</label><input id="profile-phone" type="tel" autocomplete="tel" value="${escapeHtml(p.phone)}"><label for="profile-email">Email Address</label><input id="profile-email" type="email" autocomplete="email" value="${escapeHtml(p.email)}"><div id="profile-error" class="err" role="alert"></div><div class="row modal-actions"><button class="btn l" type="button" onclick="set('md','')">Cancel</button><button class="btn" type="button" onclick="saveProfile()">Save Changes</button></div></section></div>`}
const saveProfile=()=>{const name=document.getElementById('profile-name').value.trim(),bd=document.getElementById('profile-birthday').value,gender=document.getElementById('profile-gender').value,address=document.getElementById('profile-address').value.trim(),phone=document.getElementById('profile-phone').value.trim(),email=document.getElementById('profile-email').value.trim(),error=document.getElementById('profile-error');error.textContent='';if(!name||!bd||!gender||!address||!phone||!email){error.textContent='Please complete every profile detail.';return}if(!/^\S+@\S+\.\S+$/.test(email)){error.textContent='Enter a valid email address.';return}if(age(bd)<18){error.textContent='You must be 18 years old and above.';return}S.name=name;S.profile={bd,gender,address,phone,email};S.r.em=email;S.profileDraft=null;S.md='';render();toast('Profile updated')};
const pickProfilePhoto=input=>{const f=input.files&&input.files[0];if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)){toast('Choose a JPG, PNG, or WebP image.');input.value='';return}if(f.size>5*1024*1024){toast('Profile photos must be 5 MB or smaller.');input.value='';return}const reader=new FileReader();reader.onload=()=>{if(typeof reader.result!=='string'){toast('Unable to load this image.');return}S.photo=reader.result;render();toast('Profile photo updated')};reader.onerror=()=>toast('Unable to read this image. Please try another file.');reader.readAsDataURL(f)};
const chpw=()=>{S.passwordError='';S.md='password';render()};
function passwordModal(){return `<div class="md"><section role="dialog" aria-modal="true" aria-labelledby="password-modal-title"><div class="row sp"><h2 id="password-modal-title">Change Password</h2></div><p class="muted">Enter your current password, then choose and confirm a new password.</p><label for="old-password">Old Password</label><input id="old-password" type="password" autocomplete="current-password"><label for="new-password">New Password</label><input id="new-password" type="password" autocomplete="new-password"><label for="confirm-password">Re-enter New Password</label><input id="confirm-password" type="password" autocomplete="new-password"><div id="password-error" class="err" role="alert"></div><div class="row" style="margin-top:18px"><button class="btn l" type="button" onclick="set('md','')">Cancel</button><button class="btn" type="button" onclick="savePassword()">Save Password</button></div></section></div>`}
const savePassword=()=>{const old=document.getElementById('old-password').value,next=document.getElementById('new-password').value,confirm=document.getElementById('confirm-password').value,error=document.getElementById('password-error');error.textContent='';if(!old||!next||!confirm){error.textContent='Please fill in all password fields.';return}if(old!==S.r.pw){error.textContent='The old password is incorrect.';return}if(next.length<8){error.textContent='New password must be at least 8 characters.';return}if(next!==confirm){error.textContent='The new passwords do not match.';return}if(next===old){error.textContent='Choose a password different from your old password.';return}S.r.pw=next;S.md='';render();toast('Password changed successfully')};
/* ---------- router ---------- */
function build(){const h=(location.hash||'#/').slice(2).split('/'),p=h[0]||'land',a=+h[1];const need=['home','browse','activity','join','done','history','detail','certs','cert','news','read','account'];
if(need.includes(p)&&!S.logged){location.hash='#/login';return ''}
const m={land,register:reg,created,login,home,browse,activity:()=>activity(a),join:()=>join(a),done:()=>done(a),history,detail:()=>detail(a),certs,cert:()=>cert(a),news,read:()=>read(a),account};return (m[p]||land)()}
const render=()=>{const y=scrollY;$.innerHTML=build();scrollTo(0,y)};
window.addEventListener('hashchange',()=>{S.md=S.vq?'v':S.hvq?'h':'';S.vq=0;S.hvq=0;S.ck=false;$.innerHTML=build();scrollTo(0,0)});
$.innerHTML=build();
</script></body></html>
